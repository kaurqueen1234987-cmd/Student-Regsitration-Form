
<!DOCTYPE html>
<html>
<head>
    <title>Student Registration Form</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: linear-gradient(120deg, #89f7fe, #66a6ff);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
        }

        .container {
            background-color: white;
            width: 350px;
            padding: 25px;
            border-radius: 15px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.2);
        }

        h2 {
            text-align: center;
            color: #2563eb;
        }

        label {
            display: block;
            margin-top: 12px;
            font-weight: bold;
        }

        input, select {
            width: 100%;
            padding: 10px;
            margin-top: 5px;
            border: 1px solid #ccc;
            border-radius: 6px;
            box-sizing: border-box;
        }

        .gender {
            margin-top: 8px;
        }

        .gender input {
            width: auto;
        }

        button {
            width: 100%;
            padding: 12px;
            margin-top: 20px;
            background-color: #2563eb;
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 16px;
            cursor: pointer;
        }

        button:hover {
            background-color: #1e40af;
        }

    </style>
</head>

<body>

    <div class="container">

        <h2>Student Registration</h2>

        <form>

            <label>Full Name</label>
            <input type="text" placeholder="Enter your full name" required>

            <label>Email ID</label>
            <input type="email" placeholder="Enter your email" required>

            <label>Phone Number</label>
            <input type="tel" placeholder="Enter phone number" required>

            <label>Password</label>
            <input type="password" placeholder="Enter password" required>

            <label>Gender</label>

            <div class="gender">
                <input type="radio" name="gender" value="Male" required> Male

                <input type="radio" name="gender" value="Female"> Female

                <input type="radio" name="gender" value="Other"> Other
            </div>

            <label>Select Course</label>

            <select required>
                <option value="">Choose your course</option>
                <option>B.Tech CSE</option>
                <option>BCA</option>
                <option>BBA</option>
                <option>B.Sc</option>
                <option>MCA</option>
            </select>

            <button type="submit">Register Now</button>

        </form>

    </div>
    <script>
// For Firebase JS SDK v7.20.0 and later, measurementId is optional
const firebaseConfig = {
  apiKey: "AIzaSyC00iAWG5Ua7w95eCTY86UyAV_SHzSCT7E",
  authDomain: "student-registration-for-9d6c4.firebaseapp.com",
  projectId: "student-registration-for-9d6c4",
  storageBucket: "student-registration-for-9d6c4.firebasestorage.app",
  messagingSenderId: "461024464394",
  appId: "1:461024464394:web:bf02d3cb79971b1ec659f3",
  measurementId: "G-Y4HSDQ9WF6"
};
    import { db } from "./firebase.js";

import {
  collection,
  addDoc
} from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

const form = document.getElementById("studentForm");

form.addEventListener("submit", async function(e) {

    e.preventDefault();

    const name = document.getElementById("name").value;
    const email = document.getElementById("email").value;
    const phone = document.getElementById("phone").value;

    try {

        await addDoc(collection(db, "students"), {
            name: name,
            email: email,
            phone: phone
        });

        alert("Student Registered Successfully!");

        form.reset();

    } catch (error) {

        console.error("Error adding document: ", error);
        alert("Registration Failed!");

    }

});
    </script>
</body>
</html>
